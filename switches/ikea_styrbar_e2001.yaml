blueprint:
  name: IKEA STYRBAR – light with themes (Zigbee2MQTT)
  description: >
    Control a light with the four-button IKEA STYRBAR remote (E2001/E2002) via Zigbee2MQTT.

    Up button: turns the light on (where it left off, or with a chosen scene).
    Holding it increases brightness.

    Down button: press turns the light off, hold decreases brightness (only when the light is on).

    Right / left arrow: switch to the next / previous theme (scene).
    If the light is off, the arrow turns it on with that theme.
    Holding left / right makes the light warmer / colder (only when the light is on
    and supports color temperature).

    Note: Zigbee2MQTT creates the MQTT device triggers only after an action has
    been seen once, so press (and hold) every button once before setting up the
    automation.
  domain: automation
  input:
    remote:
      name: STYRBAR remote
      description: Your STYRBAR remote from Zigbee2MQTT.
      selector:
        device:
          filter:
            - integration: mqtt
    light:
      name: Light
      description: The light controlled by the remote.
      selector:
        entity:
          filter:
            - domain: light
    themes:
      name: Themes (scenes)
      description: >
        Scenes cycled through with the arrow buttons
        (reading, night light, focus…). You can add them later.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: scene
    turn_on_scene:
      name: Turn-on scene
      description: >
        How the light turns on with the up button. Leave empty to resume where
        it left off (last brightness and color), or pick a scene to always turn
        on with it. If the scene is one of the themes, the arrows continue from
        it.
      default: ""
      selector:
        entity:
          filter:
            - domain: scene
    theme_index:
      name: Theme index helper
      description: >
        Number helper (input_number) where the automation stores which theme
        is currently active. Min 0, max 20, step 1 is enough.
      selector:
        entity:
          filter:
            - domain: input_number
    dim_step:
      name: Dimming step
      description: How many percent the brightness changes with each step while holding.
      default: 10
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "%"
    temp_step:
      name: Color temperature step
      description: How many kelvin the color temperature changes with each step while holding an arrow.
      default: 200
      selector:
        number:
          min: 50
          max: 1000
          step: 50
          unit_of_measurement: K
    dim_delay:
      name: Dimming speed
      description: Delay between steps while a button is held (brightness and color temperature).
      default: 300
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: ms

mode: parallel
max: 10
max_exceeded: silent

variables:
  light_entity: !input light
  themes: !input themes
  turn_on_scene: !input turn_on_scene
  theme_index: !input theme_index
  dim_step: !input dim_step
  dim_delay: !input dim_delay
  temp_step: !input temp_step
  step_abs: "{{ (dim_step * 2.55) | int }}"

triggers:
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: "on"
    id: "on"
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: "off"
    id: "off"
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: brightness_move_up
    id: up
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: brightness_move_down
    id: down
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: arrow_right_click
    id: next
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: arrow_left_click
    id: prev
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: arrow_left_hold
    id: warmer
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: arrow_right_hold
    id: colder

actions:
  - choose:
      # ---------- Up: press = turn on ----------
      - conditions:
          - condition: trigger
            id: "on"
          - condition: template
            value_template: "{{ is_state(light_entity, 'off') }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ turn_on_scene | length > 0 }}"
            then:
              # Turn on with the chosen scene
              - action: scene.turn_on
                target:
                  entity_id: "{{ turn_on_scene }}"
              - if:
                  - condition: template
                    value_template: "{{ turn_on_scene in themes }}"
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: "{{ theme_index }}"
                    data:
                      value: "{{ themes.index(turn_on_scene) }}"
            else:
              # Resume where it left off
              - action: light.turn_on
                target:
                  entity_id: "{{ light_entity }}"

      # ---------- Down: press = turn off ----------
      - conditions:
          - condition: trigger
            id: "off"
          - condition: template
            value_template: "{{ is_state(light_entity, 'on') }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ light_entity }}"

      # ---------- Arrows: next / previous theme ----------
      - conditions:
          - condition: trigger
            id:
              - next
              - prev
          - condition: template
            value_template: "{{ themes | count > 0 }}"
        sequence:
          - variables:
              current_idx: "{{ states(theme_index) | float(-1) | int }}"
              new_idx: >
                {% set n = themes | count %}
                {% if is_state(light_entity, 'off') and current_idx >= 0 and current_idx < n %}
                  {{ current_idx }}
                {% elif trigger.id == 'next' %}
                  {{ (current_idx + 1) % n }}
                {% else %}
                  {{ (current_idx - 1) % n }}
                {% endif %}
          - action: input_number.set_value
            target:
              entity_id: "{{ theme_index }}"
            data:
              value: "{{ new_idx | int }}"
          - action: scene.turn_on
            target:
              entity_id: "{{ themes[new_idx | int] }}"

      # ---------- Up: hold = increase brightness ----------
      - conditions:
          - condition: trigger
            id: up
        sequence:
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ light_entity }}"
                  data:
                    brightness: >
                      {{ [ (state_attr(light_entity, 'brightness') | int(0)) + step_abs, 255 ] | min }}
                    transition: "{{ dim_delay / 1000 }}"
                - wait_for_trigger:
                    - trigger: device
                      domain: mqtt
                      device_id: !input remote
                      type: action
                      subtype: brightness_stop
                  timeout:
                    milliseconds: "{{ dim_delay }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: >
                    {{ wait.trigger is not none
                       or repeat.index >= 30
                       or (state_attr(light_entity, 'brightness') | int(0)) >= 255 }}

      # ---------- Down: hold = decrease brightness (only when on) ----------
      - conditions:
          - condition: trigger
            id: down
          - condition: template
            value_template: "{{ is_state(light_entity, 'on') }}"
        sequence:
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ light_entity }}"
                  data:
                    brightness: >
                      {{ [ (state_attr(light_entity, 'brightness') | int(0)) - step_abs, 3 ] | max }}
                    transition: "{{ dim_delay / 1000 }}"
                - wait_for_trigger:
                    - trigger: device
                      domain: mqtt
                      device_id: !input remote
                      type: action
                      subtype: brightness_stop
                  timeout:
                    milliseconds: "{{ dim_delay }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: >
                    {{ wait.trigger is not none
                       or repeat.index >= 30
                       or (state_attr(light_entity, 'brightness') | int(0)) <= 3 }}

      # ---------- Arrows: hold = warmer (left) / colder (right) ----------
      - conditions:
          - condition: trigger
            id:
              - warmer
              - colder
          - condition: template
            value_template: >
              {{ is_state(light_entity, 'on')
                 and 'color_temp' in (state_attr(light_entity, 'supported_color_modes') or []) }}
        sequence:
          - variables:
              direction: "{{ -1 if trigger.id == 'warmer' else 1 }}"
              min_k: "{{ state_attr(light_entity, 'min_color_temp_kelvin') | int(2200) }}"
              max_k: "{{ state_attr(light_entity, 'max_color_temp_kelvin') | int(4000) }}"
          - repeat:
              sequence:
                - variables:
                    # If the light is in a color mode (e.g. RGB scene), start from the middle
                    current_k: >
                      {{ state_attr(light_entity, 'color_temp_kelvin')
                         | int(((min_k + max_k) / 2) | int) }}
                - action: light.turn_on
                  target:
                    entity_id: "{{ light_entity }}"
                  data:
                    color_temp_kelvin: >
                      {{ [ [ current_k + direction * temp_step, min_k ] | max, max_k ] | min | int }}
                    transition: "{{ dim_delay / 1000 }}"
                - wait_for_trigger:
                    - trigger: device
                      domain: mqtt
                      device_id: !input remote
                      type: action
                      subtype: arrow_left_release
                    - trigger: device
                      domain: mqtt
                      device_id: !input remote
                      type: action
                      subtype: arrow_right_release
                  timeout:
                    milliseconds: "{{ dim_delay }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: >
                    {% set k = state_attr(light_entity, 'color_temp_kelvin') | int(0) %}
                    {{ wait.trigger is not none
                       or repeat.index >= 30
                       or (direction < 0 and k <= min_k)
                       or (direction > 0 and k >= max_k) }}
