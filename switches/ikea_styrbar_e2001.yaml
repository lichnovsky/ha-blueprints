blueprint:
  name: IKEA STYRBAR – lights with themes (Zigbee2MQTT)
  description: >
    Control a room or lights with the four-button IKEA STYRBAR remote (E2001/E2002)
    via Zigbee2MQTT.

    Up button: turns all the lights on (where they left off, or with a chosen
    scene). Holding it increases brightness.

    Down button: press turns all the lights off, hold decreases brightness
    (stops before the dimmest light would turn off).

    Right / left arrow: switch to the next / previous theme (scene).
    Holding left / right makes the lights warmer / colder (only lights that are on
    and support color temperature).

    Dimming and color temperature change every light relative to its own value,
    so the ratios from a scene are kept.

    Note: Zigbee2MQTT creates the MQTT device triggers only after an action has
    been seen once, so press (and hold) every button once before setting up the
    automation.
  domain: automation
  input:
    remote:
      name: STYRBAR remote
      description: Your STYRBAR remote from Zigbee2MQTT.
      selector:
        device:
          filter:
            - integration: mqtt
    light:
      name: Room or lights
      description: >
        What the remote controls: a room (area), a floor, a label, devices or
        individual lights. Light groups (Home Assistant or Zigbee2MQTT) work too.
      selector:
        target:
          entity:
            - domain: light
    themes:
      name: Themes (scenes)
      description: >
        Scenes cycled through with the arrow buttons
        (reading, night light, focus…). You can add them later.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: scene
    turn_on_scene:
      name: Turn-on scene
      description: >
        How the lights turn on with the up button. Leave empty to resume where
        they left off (last brightness and color), or pick a scene to always turn
        on with it. If the scene is one of the themes, the arrows continue from
        it.
      default: ""
      selector:
        entity:
          filter:
            - domain: scene
    theme_index:
      name: Theme index helper
      description: >
        Number helper (input_number) where the automation stores which theme
        is currently active. Min 0, max 20, step 1 is enough.
      selector:
        entity:
          filter:
            - domain: input_number
    dim_step:
      name: Dimming step
      description: How many percent the brightness changes with each step while holding.
      default: 10
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "%"
    temp_step:
      name: Color temperature step
      description: How many kelvin the color temperature changes with each step while holding an arrow.
      default: 200
      selector:
        number:
          min: 50
          max: 1000
          step: 50
          unit_of_measurement: K
    dim_delay:
      name: Dimming speed
      description: Delay between steps while a button is held (brightness and color temperature).
      default: 300
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: ms

mode: parallel
max: 10
max_exceeded: silent

variables:
  light_target: !input light
  themes: !input themes
  turn_on_scene: !input turn_on_scene
  theme_index: !input theme_index
  dim_step: !input dim_step
  temp_step: !input temp_step
  dim_delay: !input dim_delay
  step_abs: "{{ (dim_step * 2.55) | int }}"
  # Lights behind the target; only used for dimming limit and color temperature
  lights: >
    {% set t = light_target if light_target is mapping else {'entity_id': light_target} %}
    {% macro as_list(v) %}{{ ([v] if v is string else (v or [])) | to_json }}{% endmacro %}
    {% set ns = namespace(e=[], areas=[], out=[]) %}
    {% set ns.e = as_list(t.get('entity_id')) | from_json %}
    {% set ns.areas = as_list(t.get('area_id')) | from_json %}
    {% for f in as_list(t.get('floor_id')) | from_json %}
      {% set ns.areas = ns.areas + floor_areas(f) %}
    {% endfor %}
    {% for a in ns.areas %}
      {% set ns.e = ns.e + area_entities(a) %}
    {% endfor %}
    {% for d in as_list(t.get('device_id')) | from_json %}
      {% set ns.e = ns.e + device_entities(d) %}
    {% endfor %}
    {% for l in as_list(t.get('label_id')) | from_json %}
      {% set ns.e = ns.e + label_entities(l) %}
    {% endfor %}
    {% for e in ns.e | select('match', 'light\.') | unique %}
      {% if state_attr(e, 'entity_id') is none %}
        {% set ns.out = ns.out + [e] %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}

triggers:
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: "on"
    id: "on"
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: "off"
    id: "off"
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: brightness_move_up
    id: up
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: brightness_move_down
    id: down
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: arrow_right_click
    id: next
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: arrow_left_click
    id: prev
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: arrow_left_hold
    id: warmer
  - trigger: device
    domain: mqtt
    device_id: !input remote
    type: action
    subtype: arrow_right_hold
    id: colder

actions:
  - choose:
      # ---------- Up: press = turn everything on ----------
      - conditions:
          - condition: trigger
            id: "on"
        sequence:
          - if:
              - condition: template
                value_template: "{{ turn_on_scene | length > 0 }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ turn_on_scene }}"
              - if:
                  - condition: template
                    value_template: "{{ turn_on_scene in themes }}"
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: "{{ theme_index }}"
                    data:
                      value: "{{ themes.index(turn_on_scene) }}"
            else:
              - action: light.turn_on
                target: !input light

      # ---------- Down: press = turn everything off ----------
      - conditions:
          - condition: trigger
            id: "off"
        sequence:
          - action: light.turn_off
            target: !input light

      # ---------- Arrows: next / previous theme ----------
      - conditions:
          - condition: trigger
            id:
              - next
              - prev
          - condition: template
            value_template: "{{ themes | count > 0 }}"
        sequence:
          - variables:
              current_idx: "{{ states(theme_index) | float(-1) | int }}"
              new_idx: >
                {% set n = themes | count %}
                {% if current_idx < 0 %}
                  {{ 0 if trigger.id == 'next' else n - 1 }}
                {% else %}
                  {{ (current_idx + (1 if trigger.id == 'next' else -1)) % n }}
                {% endif %}
          - action: input_number.set_value
            target:
              entity_id: "{{ theme_index }}"
            data:
              value: "{{ new_idx | int }}"
          - action: scene.turn_on
            target:
              entity_id: "{{ themes[new_idx | int] }}"

      # ---------- Up / Down: hold = brighter / dimmer ----------
      - conditions:
          - condition: trigger
            id:
              - up
              - down
        sequence:
          - condition: template
            value_template: >
              {% set on = lights | select('is_state', 'on') | list %}
              {{ trigger.id == 'up' or on | count == 0
                 or on | map('state_attr', 'brightness') | map('int', 0) | min > step_abs }}
          - repeat:
              sequence:
                - action: light.turn_on
                  target: !input light
                  data:
                    brightness_step_pct: "{{ dim_step if trigger.id == 'up' else -dim_step }}"
                    transition: "{{ dim_delay / 1000 }}"
                - wait_for_trigger:
                    - trigger: device
                      domain: mqtt
                      device_id: !input remote
                      type: action
                      subtype: brightness_stop
                  timeout:
                    milliseconds: "{{ dim_delay }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: >
                    {% set on = lights | select('is_state', 'on') | list %}
                    {{ wait.trigger is not none
                       or repeat.index >= 30
                       or (trigger.id == 'down' and on | count > 0
                           and on | map('state_attr', 'brightness') | map('int', 0) | min <= step_abs) }}

      # ---------- Arrows: hold = warmer (left) / colder (right), per light ----------
      - conditions:
          - condition: trigger
            id:
              - warmer
              - colder
        sequence:
          - variables:
              direction: "{{ -1 if trigger.id == 'warmer' else 1 }}"
              ct_targets: >
                {% set ns = namespace(out=[]) %}
                {% for e in lights | select('is_state', 'on') %}
                  {% if 'color_temp' in (state_attr(e, 'supported_color_modes') or []) %}
                    {% set ns.out = ns.out + [e] %}
                  {% endif %}
                {% endfor %}
                {{ ns.out }}
          - condition: template
            value_template: "{{ ct_targets | count > 0 }}"
          - repeat:
              sequence:
                - repeat:
                    for_each: "{{ ct_targets }}"
                    sequence:
                      - variables:
                          min_k: "{{ state_attr(repeat.item, 'min_color_temp_kelvin') | int(2200) }}"
                          max_k: "{{ state_attr(repeat.item, 'max_color_temp_kelvin') | int(4000) }}"
                          # In a color mode (e.g. RGB scene) there is no temperature, start from the middle
                          current_k: >
                            {{ state_attr(repeat.item, 'color_temp_kelvin')
                               | int(((min_k + max_k) / 2) | int) }}
                      - action: light.turn_on
                        target:
                          entity_id: "{{ repeat.item }}"
                        data:
                          color_temp_kelvin: >
                            {{ [ [ current_k + direction * temp_step, min_k ] | max, max_k ] | min | int }}
                          transition: "{{ dim_delay / 1000 }}"
                - wait_for_trigger:
                    - trigger: device
                      domain: mqtt
                      device_id: !input remote
                      type: action
                      subtype: arrow_left_release
                    - trigger: device
                      domain: mqtt
                      device_id: !input remote
                      type: action
                      subtype: arrow_right_release
                  timeout:
                    milliseconds: "{{ dim_delay }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none or repeat.index >= 30 }}"
